server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Backend API'ye yönlendirme (Opsiyonel - Proxy Pass)
    # Eğer frontend 80 portundan çalışırken /api isteklerini 
    # doğrudan backend'e göndermek istersen burayı kullanabilirsin.
    # location /api {
    #     proxy_pass http://api:8080;
    # }
}