services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: harmonii-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -Q 'SELECT 1' -C"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - harmonii-network

  api:
    build:
      context: .
      dockerfile: harmonii.Server/Dockerfile
    container_name: harmonii-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=HarmoniiDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - JWT__ValidAudience=${JWT_VALID_AUDIENCE}
      - JWT__ValidIssuer=${JWT_VALID_ISSUER}
      - JWT__Token=${JWT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - harmonii-network

  minio:
    image: minio/minio
    container_name: harmonii-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    networks:
      - harmonii-network

volumes:
  mssql-data:

networks:
  harmonii-network:
    driver: bridge
